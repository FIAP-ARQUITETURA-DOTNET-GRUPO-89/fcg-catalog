apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-catalog-worker
  namespace: fcg-platform
  labels:
    app.kubernetes.io/name: fcg-catalog-worker
    app.kubernetes.io/instance: fcg-catalog-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: fcg-platform
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fcg-catalog-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fcg-catalog-worker
        app.kubernetes.io/instance: fcg-catalog-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: fcg-platform
    spec:
      containers:
        - name: fcg-catalog-worker
          # Substituir pela URI real do ECR fornecida (ex: 123456789012.dkr.ecr.us-east-1.amazonaws.com/fcg-catalog-worker:latest)
          image: fcg-catalog-worker:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: fcg-catalog-worker-config
            - secretRef:
                name: fcg-catalog-worker-secret
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "ps aux | grep dotnet | grep -v grep"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "ps aux | grep dotnet | grep -v grep"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false