apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-catalog-worker
  namespace: fcg-platform
  labels:
    app.kubernetes.io/name: fcg-catalog-worker
    app.kubernetes.io/instance: fcg-catalog-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: fcg-platform
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fcg-catalog-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fcg-catalog-worker
        app.kubernetes.io/instance: fcg-catalog-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: fcg-platform
    spec:
      containers:
        - name: fcg-catalog-worker
          image: 368379549295.dkr.ecr.us-east-1.amazonaws.com/fcg-catalog-worker:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: fcg-catalog-worker-config
            - secretRef:
                name: fcg-catalog-worker-secret
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false