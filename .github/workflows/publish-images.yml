name: 🐳 Publish FcgCatalog Images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: 🐳 Build & Push Images
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 📦 Restore
        run: dotnet restore

      - name: 🔨 Build
        run: dotnet build --configuration Release --no-restore

      - name: 🧪 Execute Unit Tests
        run: |
          dotnet test tests/FcgCatalog.UnitTests/FcgCatalog.UnitTests.csproj \
            --no-build \
            --configuration Release

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ Extract Version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      ####################################################
      # Catalog API
      ####################################################

      - name: 🚀 Build & Push Catalog API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/FcgCatalog.Api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fcg-catalog-api:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fcg-catalog-api:latest

      ####################################################
      # Catalog Worker
      ####################################################

      - name: 🚀 Build & Push Catalog Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/FcgCatalog.Worker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fcg-catalog-worker:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fcg-catalog-worker:latest