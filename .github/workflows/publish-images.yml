name: 🐳 Publish FcgCatalog Images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: 🐳 Build & Push Images to AWS ECR
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 📦 Restore
        run: dotnet restore

      - name: 🔨 Build
        run: dotnet build --configuration Release --no-restore

      - name: 🧪 Execute Unit Tests
        run: |
          dotnet test tests/FcgCatalog.UnitTests/FcgCatalog.UnitTests.csproj \
            --no-build \
            --configuration Release

      - name: 🔐 Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 🐳 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🏷️ Extract Version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      ####################################################
      # Catalog API
      ####################################################

      - name: 🚀 Build & Push Catalog API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/FcgCatalog.Api/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/fcg-catalog-api:${{ steps.version.outputs.version }}
            ${{ steps.login-ecr.outputs.registry }}/fcg-catalog-api:latest

      ####################################################
      # Catalog Worker
      ####################################################

      - name: 🚀 Build & Push Catalog Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/FcgCatalog.Worker/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/fcg-catalog-worker:${{ steps.version.outputs.version }}
            ${{ steps.login-ecr.outputs.registry }}/fcg-catalog-worker:latest
