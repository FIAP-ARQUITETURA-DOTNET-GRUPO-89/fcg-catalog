name: 🚀 CD - Catalog

on:
  workflow_run:
    workflows: ["🐳 Publish FcgCatalog Images"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag da imagem publicada no ECR (ex: latest ou 4.0.0-preview.3)'
        required: true
        default: 'latest'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: fcg-platform
  K8S_NAMESPACE: fcg-platform
  ECR_REGISTRY: 368379549295.dkr.ecr.us-east-1.amazonaws.com

jobs:
  deploy:
    name: ☸️ Deploy Catalog to EKS
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🔑 Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || env.AWS_REGION }}

      - name: 🏷️ Definir Tag da Imagem
        id: set-tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "IMAGE_TAG=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: ☸️ Configurar Kubeconfig para o EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: 🏗️ Garantir Namespace e Manifests Base (Primeiro Deploy)
        run: |
          kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/api/ -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f k8s/worker/ -n ${{ env.K8S_NAMESPACE }}

      - name: 🔄 Atualizar Deployments no EKS (API e Worker)
        env:
          IMAGE_TAG: ${{ steps.set-tag.outputs.IMAGE_TAG }}
        run: |
          kubectl set image deployment/fcg-catalog-api \
            fcg-catalog-api=${{ env.ECR_REGISTRY }}/fcg-catalog-api:${IMAGE_TAG} \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/fcg-catalog-api -n ${{ env.K8S_NAMESPACE }}

          kubectl set image deployment/fcg-catalog-worker \
            fcg-catalog-worker=${{ env.ECR_REGISTRY }}/fcg-catalog-worker:${IMAGE_TAG} \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/fcg-catalog-worker -n ${{ env.K8S_NAMESPACE }}