name: 🐳 Publish FcgCatalog Images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Publish Catalog API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/FcgCatalog.Api/Dockerfile
          push: true
          tags: |
            jondamiao/fcg-catalog-api:${{ env.VERSION }}
            jondamiao/fcg-catalog-api:latest

      - name: Publish Catalog Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/FcgCatalog.Worker/Dockerfile
          push: true
          tags: |
            jondamiao/fcg-catalog-worker:${{ env.VERSION }}
            jondamiao/fcg-catalog-worker:latest
